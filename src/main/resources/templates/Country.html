<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<!-- <link href="//netdna.bootstrapcdn.com/bootstrap/3.1.0/css/bootstrap.min.css"rel="stylesheet" id="bootstrap-css">
<script src="//netdna.bootstrapcdn.com/bootstrap/3.1.0/js/bootstrap.min.js"></script> -->
<title>Country</title>

	<link rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
		integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	
	<!-- Remix Icon CDN -->
	<link
		href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css"
		rel="stylesheet" />

	<link th:href="@{/css/style.css}" rel="stylesheet">
	<link th:href="@{/css/toast.css}" rel="stylesheet">
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/custom_table.css}">
<script src="//code.jquery.com/jquery-1.11.1.min.js"></script> 

</head>
<body style="background-color: gray;">




		<!-- Sidebar -->
		<div th:replace="Layout/Fragments/header.html :: header"></div>
		<!-- Sidebar Ended Here  -->

<div class="main-content  p-0" style="height:100%;">
	<div th:replace="Layout/Fragments/header.html :: topbar"></div>

	<div class="container-fluid row pb-3 d-flex justify-content-center mt-5">
	
	
	
<!-- <div class="ms-5 col-md-12">

<div class="   "> -->
			<div class="ms-5 col-md-8 p-3 border mb-4">
				<div class="panel">
					<div class="panel-heading">
						<div class="panel-title">Country</div>
						<div style="padding-top: 30px" class="panel-body">
							
							<form th:action="@{saveCountry}" th:object="${country}"  method="post">
								
								<div style="margin-bottom: 25px" class="input-group">
									<label for="countrycode" class="me-3"> Country Name</label> 
									<input id="countrycode" th:field="*{countryName}" type="text" class="form-control"
										name="countrycode">
										
										<span th:if="${#fields.errors('countryName')}"
											th:errors="*{countryName}" th:errorClass="error">Field
											ERROR</span>
									
								</div>
								
								<div class="form-group">
									<div class="text-center controls">
										<button type="reset" class="btn btn-reset">Cancel</button>
										<button type="submit" class="btn btn-primary">Save</button>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
			
<div class="container-fluid row pb-3 d-flex justify-content-center">
			<div class="col-md-12 ms-5">
				<div class="card">
					<div class="card-body">
						<table class="table" border="3">
							<thead>
								<tr>
									<th scope="col">Id</th>
									<th scope="col">CountryName</th>
									<th scope="col">Action</th>
								</tr>
							</thead>
							<tbody>
							
							

 								<tr th:each="i:${countryList}">
									<td th:text="${i.id}"></td>
									<td th:text="${i.countryName}"></td>
									<td><a th:href="@{update(id=${i.id})}"
										class="btn btn-success">Update</a> <a
										th:href="@{delete(id=${i.id})}" class="btn btn-danger">Delete</a>
									</td>
								</tr> 
								
							</tbody>
						</table>
					</div>
				</div>
			</div>
			</div>
			</div>
		</div>
	<!-- </div>
	
	</div> -->
	

	
	
	<script th:src="@{/js/custom.js}"></script>
	
</body>
</html>
