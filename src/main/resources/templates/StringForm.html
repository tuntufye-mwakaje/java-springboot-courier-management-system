<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIST IN THYMELEAF</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
</head>
<body class="bg-secondary">

	<div class="container">
		<h1 class="text-center">Add String:</h1>

		<form id="myForm" action="#" th:action="@{/save-string}"
			th:object="${myString}" method="post">
			
			<div id="inputFieldContainer">
			
				<div th:each="str, index : *{strings}"
					class="text-center">
					<input type="text" th:field="*{strings[__${index.index}__]}"
						class="form-control" placeholder="Enter value" />
				</div>
				
			</div>

			<div class="text-center">
				<button type="button" class="btn btn-danger mt-4 text-center"
					onclick="removeField()">Remove String Field</button>
				<button type="button" class="btn btn-primary mt-4"
					onclick="addField()">Add String Field</button>
				<br>
				<button type="submit" class="btn btn-success mt-4">Submit</button>
			</div>


		</form>

		<h1 class="text-center mt-5">My String List:</h1>

		<table class="table text-center">
			<thead>
				<tr>
					<th scope="col">Strings</th>
				</tr>
			</thead>



			<tbody>
				<tr th:each="str : ${mainMyString.strings}">
					<td th:text="${str}"></td>
				</tr>
			</tbody>

		</table>

	</div>



	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>

	<script>
		function addField() {
			var inputFieldContainer = document
					.getElementById('inputFieldContainer');
			/* var newInput = document.createElement('input');
			newInput.type = 'text';
			newInput.name = 'strings[' + inputFieldContainer.children.length
					+ ']';
			newInput.className = 'form-control';
			newInput.placeholder = 'Enter value'; 
			inputFieldContainer.appendChild(newInput); */

			var index = inputFieldContainer.children.length;

			var newInput = ' <input  type="text"'+
			' name="strings['+ index +']" class="form-control mt-3" placeholder="Enter value" />';

			inputFieldContainer.insertAdjacentHTML('beforeend', newInput);

		}

		function removeField(button) {
			var inputFieldContainer = document
					.getElementById('inputFieldContainer');
			if (inputFieldContainer.children.length > 1) {
				inputFieldContainer.removeChild(inputFieldContainer.lastChild);
			}
		}
	</script>




</body>
</html>
